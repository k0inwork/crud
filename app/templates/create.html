<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Entry - My Diary</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef; margin: 20px; }
        .form-container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, textarea { width: 100%; margin-bottom: 10px; padding: 10px; box-sizing: border-box; }
        .btn { padding: 10px 15px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        .btn:hover { background: #0056b3; }
        a { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Create New Entry</h2>

        <!-- Sends a POST request to the application '/create' endpoint -->
        <form action="{{ url_for('main.create_entry') }}" method="POST">
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" required placeholder="Enter a title for your entry">

            <label for="content">Entry Content:</label>
            <!-- Multiline text area block. Set required to enforce non-empty submissions -->
            <textarea id="content" name="content" rows="10" required placeholder="Write your content here..."></textarea>

            <button type="submit" class="btn">Save Entry</button>
        </form>

        <br>
        <a href="{{ url_for('main.index') }}">Back to Index</a>
    </div>
</body>
</html>
