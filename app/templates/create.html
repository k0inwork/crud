<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создать запись - Мой Ежедневник</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef; margin: 20px; }
        .form-container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, textarea { width: 100%; margin-bottom: 10px; padding: 10px; box-sizing: border-box; }
        .btn { padding: 10px 15px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        .btn:hover { background: #0056b3; }
        a { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Создание новой записи</h2>

        <!-- Форма отправляет POST-запрос на маршрут /create -->
        <form action="{{ url_for('main.create_entry') }}" method="POST">
            <label for="title">Заголовок:</label>
            <input type="text" id="title" name="title" required placeholder="О чем сегодня поговорим?">

            <label for="content">Текст записи:</label>
            <!-- Поле для текста. required означает, что форма не отправится пустой -->
            <textarea id="content" name="content" rows="10" required placeholder="Пиши сюда все мысли..."></textarea>

            <button type="submit" class="btn">Сохранить</button>
        </form>

        <br>
        <a href="{{ url_for('main.index') }}">⬅️ Назад к списку</a>
    </div>
</body>
</html>
