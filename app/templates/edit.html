<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактировать запись - {{ entry.title }}</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef; margin: 20px; }
        .form-container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input[type="text"], textarea { width: 100%; margin-bottom: 10px; padding: 10px; box-sizing: border-box; }
        .btn { padding: 10px 15px; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px; }
        .btn:hover { background: #218838; }
        a { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Редактирование записи #{{ entry.id }}</h2>

        <!-- Форма шлет POST на edit_entry передавая id текущей записи -->
        <form action="{{ url_for('main.edit_entry', id=entry.id) }}" method="POST">
            <label for="title">Новый заголовок:</label>
            <!-- Подставляем старое значение из базы в value -->
            <input type="text" id="title" name="title" value="{{ entry.title }}" required>

            <label for="content">Новый текст:</label>
            <textarea id="content" name="content" rows="10" required>{{ entry.content }}</textarea>

            <label>
                <!-- Чекбокс для статуса "выполнено". Если True, то ставим галочку (checked) -->
                <input type="checkbox" name="is_completed" {% if entry.is_completed %}checked{% endif %}>
                Отметить как выполненную (зачеркнуть)
            </label>
            <br><br>

            <button type="submit" class="btn">Сохранить изменения</button>
        </form>

        <br>
        <a href="{{ url_for('main.index') }}">⬅️ Назад</a>
    </div>
</body>
</html>
